name: NASA API key health check

on:
  schedule:
    # Every Monday at 13:00 UTC (9am EDT / 8am EST).
    - cron: "0 13 * * 1"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  check-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check NASA API key
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/check-nasa-key.mjs